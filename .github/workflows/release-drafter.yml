name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-drafter
  cancel-in-progress: true

jobs:
  update-release-draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create and update the draft GitHub release.
      pull-requests: read # Read merged PR metadata for generated release notes.
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
